name: Android CI

# Manual APK releases; pull requests only build/test (no release publishing).
on:
  workflow_dispatch:
    inputs:
      beta:
        description: "Build a signed beta APK without publishing a production release"
        type: boolean
        required: false
        default: false
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Anything not built from main is a beta (its own package, "Clu beta"), whatever the checkbox says.
      CI_BETA_BUILD: ${{ github.event_name == 'pull_request' || inputs.beta || github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # Fixed signing key from the CLU_KEYSTORE_B64 secret (base64 of a PKCS12 keystore), so updates
      # install over the previous version. Without the secret the default debug key is used.
      - name: Restore signing key
        if: github.event_name == 'workflow_dispatch'
        env:
          CLU_KEYSTORE_B64: ${{ secrets.CLU_KEYSTORE_B64 }}
        run: |
          if [ -n "$CLU_KEYSTORE_B64" ]; then
            echo "$CLU_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/clu.p12"
            echo "CLU_KEYSTORE_FILE=$RUNNER_TEMP/clu.p12" >> "$GITHUB_ENV"
          else
            echo "CLU_KEYSTORE_B64 is not set; signing with the default debug key."
          fi
      # The unit tests (answer parsing, memory, OCR on real screenshots, Gemini/Claude replies) run
      # first: a failing test stops the build before a broken APK is published.
      - name: Unit tests
        run: ./gradlew testDebugUnitTest 2>&1 | tee gradle-test.log; exit ${PIPESTATUS[0]}
        shell: bash
      # Failed tests and compile errors as annotations, readable on the PR page from a phone (and by
      # the API) without opening the full log.
      - name: Report failed tests
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for f in glob.glob('app/build/test-results/**/*.xml', recursive=True):
              for case in ET.parse(f).getroot().iter('testcase'):
                  for bad in list(case.findall('failure')) + list(case.findall('error')):
                      msg = (bad.get('message') or bad.text or '').strip().replace('\n', ' ')[:400]
                      print(f"::error title={case.get('classname')}.{case.get('name')}::{msg}")
          try:
              for line in open('gradle-test.log', errors='replace'):
                  if line.startswith('e: ') or 'FAILED' in line or 'What went wrong' in line:
                      print('::error title=gradle::' + line.strip()[:400])
          except OSError:
              pass
          PY
      # The shared APK is the release build: compressed native libraries, same key, not shrunk.
      - name: Build APK
        run: ./gradlew assembleRelease
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Clu.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Clu-apk
          path: Clu.apk
      # Publishes a release (stable direct link .../releases/latest/download/Clu.apk) only when the
      # build is started by hand (Actions -> Android CI -> Run workflow). A release with a large APK
      # on every push filled the account with releases and may have tripped GitHub's abuse checks.
      - name: Publish release
        if: github.event_name == 'workflow_dispatch' && !inputs.beta && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Clu ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: Clu.apk
      # A beta (Run workflow with "beta", or from any branch but main) goes to one fixed
      # pre-release, so its link never changes: .../releases/download/clu-beta/Clu-beta.apk. It is the
      # app "Clu beta" (its own package), which installs beside the production app and never replaces
      # it. The release is made again each time so it points at the commit it was built from; a
      # pre-release is never "latest". The tag is not named "beta" because a branch is.
      - name: Publish beta
        if: github.event_name == 'workflow_dispatch' && (inputs.beta || github.ref != 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp Clu.apk Clu-beta.apk
          gh release delete clu-beta --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes >/dev/null 2>&1 || true
          gh release create clu-beta Clu-beta.apk --repo "$GITHUB_REPOSITORY" --prerelease --latest=false \
            --target "$GITHUB_SHA" --title "Clu beta ${{ github.run_number }}" \
            --notes "Clu beta ${{ github.run_number }} (${GITHUB_SHA::7}). Installs beside Clu; does not replace it."
